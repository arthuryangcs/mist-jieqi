name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  search-speed-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Independent experimental TT, probability, rules and cancellation
        run: |
          node native/experiments/search-speed/replay-public.mjs
          node native/experiments/search-speed/check.mjs
          node native/experiments/search-speed/reference-check.mjs
          node native/experiments/search-speed/rules.mjs
      - name: Experimental memory and undefined-behavior checks
        run: |
          node native/experiments/search-speed/check.mjs --sanitize
          node native/experiments/search-speed/reference-check.mjs --sanitize
          node native/experiments/search-speed/rules.mjs --sanitize
  search-speed-c6:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: C6 exact source and synthetic replay
        run: |
          node --test native/experiments/search-speed/c6-source.test.mjs
          node native/experiments/search-speed/replay-public.mjs benchmarks/search-speed/c6-2026-11-03/matches.json
      - name: C6 implementation equivalence, rules, privacy and cancellation
        run: |
          node native/experiments/search-speed/check-c6.mjs
          node native/experiments/search-speed/rules-c6.mjs
      - name: C6 address and undefined behavior checks
        run: |
          node native/experiments/search-speed/check-c6.mjs --sanitize
          node native/experiments/search-speed/rules-c6.mjs --sanitize
  search-speed-c7:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: C7 exact source and synthetic replay
        run: |
          node --test native/experiments/search-speed/c7-source.test.mjs
          node native/experiments/search-speed/replay-public.mjs benchmarks/search-speed/c7-2026-11-03/matches.json
      - name: C7 implementation equivalence, rules, privacy and cancellation
        run: |
          node native/experiments/search-speed/check-c7.mjs
          node native/experiments/search-speed/rules-c7.mjs
          node native/experiments/search-speed/reference-check-c7.mjs
      - name: C7 address and undefined behavior checks
        run: |
          node native/experiments/search-speed/check-c7.mjs --sanitize
          node native/experiments/search-speed/rules-c7.mjs --sanitize
          node native/experiments/search-speed/reference-check-c7.mjs --sanitize
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: JavaScript rules, privacy and UI logic
        run: npm test -- --test-concurrency=1
      - name: Native rules and search parity
        run: |
          node native/check.mjs
          node native/repetition-check.mjs
          JIEQI_NATIVE_SANITIZE=1 node native/repetition-check.mjs
      - name: HTTP streaming, legacy clients and cancellation
        run: node --test native/service-check.mjs
      - name: Build independent tactical LMR prototype
        run: |
          node native/experiments/time-search/build.mjs --freeze
          node native/experiments/tactical-lmr/build.mjs
          node native/experiments/tactical-lmr/build.mjs --trace
          node native/experiments/tactical-lmr/build.mjs --sanitize --trace
      - name: Prototype rules, probability, privacy and rollback
        run: |
          node native/experiments/tactical-lmr/check.mjs
          node native/experiments/tactical-lmr/check.mjs --sanitize
      - name: Build bounded and clustered TT prototypes
        run: |
          node native/experiments/cluster-tt/build.mjs --control
          node native/experiments/cluster-tt/build.mjs
          node native/experiments/cluster-tt/build.mjs --trace
          node native/experiments/cluster-tt/build.mjs --trace --sanitize
      - name: TT collision, memory bound, probability and rollback checks
        run: |
          node native/experiments/cluster-tt/table-check.mjs
          node native/experiments/cluster-tt/check.mjs
          node native/experiments/cluster-tt/check.mjs --sanitize
          node native/experiments/cluster-tt/control-saturation.mjs
      - name: Protected null-move prototype
        run: |
          node native/experiments/verified-null/build.mjs --control
          node native/experiments/verified-null/build.mjs
          node native/experiments/verified-null/build.mjs --trace
          node native/experiments/verified-null/build.mjs --trace --sanitize
          node native/experiments/verified-null/null-check.mjs
          node native/experiments/verified-null/check.mjs
          node native/experiments/verified-null/check.mjs --sanitize
          node native/experiments/verified-null/control-saturation.mjs
          node native/experiments/verified-null/cancel-check.mjs
      - name: All-compatible-features composition and correctness
        run: |
          node native/experiments/all-features/build.mjs --control
          node native/experiments/all-features/build.mjs
          node native/experiments/all-features/build.mjs --sanitize
          node native/experiments/all-features/unit-check.mjs
          node native/experiments/all-features/check.mjs
          node native/experiments/all-features/check.mjs --sanitize
          node native/experiments/all-features/control-saturation.mjs
          node native/experiments/all-features/cancel-check.mjs
  search-speed-c8:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: C8 exact geometry source and unchanged search
        run: |
          node --test native/experiments/search-speed/c8-source.test.mjs
          node native/experiments/search-speed/replay-public.mjs benchmarks/search-speed/c8-2026-11-08/matches.json
      - name: C8 ordered geometry, search, rules and privacy
        run: |
          node native/experiments/search-speed/check-c8.mjs
          node native/experiments/search-speed/rules-c8.mjs
          node native/experiments/search-speed/reference-check-c8.mjs
      - name: C8 address and undefined behavior checks
        run: |
          node native/experiments/search-speed/check-c8.mjs --sanitize
          node native/experiments/search-speed/rules-c8.mjs --sanitize
          node native/experiments/search-speed/reference-check-c8.mjs --sanitize

  selfplay-value:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Self-play privacy, grouped data and portable frozen-model replay
        run: |
          node --test native/experiments/selfplay-value/dataset.test.mjs
          node native/experiments/selfplay-value/replay-data.mjs
      - name: Isolated current-HCE residual build and rule checks
        run: |
          node native/experiments/selfplay-value/build.mjs --control
          node native/experiments/selfplay-value/check.mjs
          node native/experiments/selfplay-value/rules.mjs
      - name: Address and undefined-behavior checks
        run: |
          node native/experiments/selfplay-value/check.mjs --sanitize
          node native/experiments/selfplay-value/rules.mjs --sanitize

  buffered-sort:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Frozen source, paired ledger and portable replay
        run: |
          node --test native/experiments/buffered-sort/source.test.mjs native/experiments/buffered-sort/matches.test.mjs
          node native/experiments/buffered-sort/matches.mjs replay
      - name: Stable sort oracle, HCE equivalence and rules
        run: |
          node native/experiments/buffered-sort/sort-probe.mjs
          node native/experiments/buffered-sort/check.mjs
          node native/experiments/buffered-sort/rules.mjs
      - name: Address and undefined-behavior checks
        run: |
          node native/experiments/buffered-sort/sort-probe.mjs --sanitize
          node native/experiments/buffered-sort/check.mjs --sanitize
          node native/experiments/buffered-sort/rules.mjs --sanitize
  jqe-evaluator:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: devinokeefe/jieqi
          ref: 331a6e612a038c4a04cf980f7b9482910fd50078
          path: external/jqe
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Additional paired games and independent repetition audit
        run: |
          node --test native/experiments/jqe-followup/matches.test.mjs native/experiments/jqe-followup/audit.test.mjs
          node native/experiments/jqe-followup/matches.mjs replay
          node native/experiments/jqe-followup/audit.mjs benchmarks/jqe-followup-2026-11-09/matches.json
      - name: Pinned network, upstream inference, privacy and undo
        run: |
          node --test native/experiments/jqe/source.test.mjs
          node native/experiments/jqe/check.mjs
          node native/experiments/jqe/rules.mjs
      - name: Memory safety and deterministic multiworld inference
        run: |
          node native/experiments/jqe/check.mjs --sanitize
          node native/experiments/jqe/rules.mjs --sanitize
          node native/experiments/jqe/thread-check.mjs
      - name: Opt-in HTTP boundaries and cancellation
        run: node --test native/experiments/jqe/service-check.mjs
  rule-reply-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Lawful public-history proofs and old-game forensic reproduction
        run: |
          node --test native/experiments/rule-reply/policy.test.mjs
          node native/experiments/rule-reply/diagnose.mjs
      - name: Independent candidate and unchanged-default control
        run: |
          node native/experiments/default-all/build.mjs
          node native/experiments/rule-reply/build.mjs
          node native/experiments/rule-reply/build.mjs --sanitize
          node native/experiments/rule-reply/check.mjs
      - name: Actual temporary HTTP and frozen paired-game audit
        run: |
          node native/experiments/rule-reply/integration.mjs
          node native/experiments/rule-reply/matches.mjs replay
          node native/experiments/rule-reply/audit.mjs benchmarks/rule-reply-2026-11-24/matches.json /tmp/rule-reply-audit.json
  default-all-compatible:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Default selection, rollback and portable fresh build
        run: |
          node --test native/experiments/default-all/default.test.mjs
          node --input-type=module -e "import{build,buildControl}from'./native/experiments/default-all/build.mjs';buildControl();build();build({sanitize:true});"
      - name: Inventory TT, null, probability, privacy and restoration
        run: |
          node native/experiments/default-all/unit-check.mjs
          node native/experiments/default-all/check.mjs
          node native/experiments/default-all/check.mjs --sanitize
          node native/experiments/default-all/repetition.mjs
          JIEQI_NATIVE_SANITIZE=1 node native/experiments/default-all/repetition.mjs
      - name: Actual default HTTP, cancellation and frozen public games
        run: |
          node native/experiments/default-all/integration.mjs
          node native/experiments/default-all/matches.mjs replay
          node native/experiments/jqe-retest/audit.mjs benchmarks/default-all-2026-11-18/matches.json /tmp/default-all-audit.json
  jqe-current-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: devinokeefe/jieqi
          ref: 331a6e612a038c4a04cf980f7b9482910fd50078
          path: external/jqe
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Frozen current-rule paired ledger and independent audit
        run: |
          node --test native/experiments/jqe-current/source.test.mjs native/experiments/jqe-retest/matches.test.mjs native/experiments/jqe-retest/audit.test.mjs
          node native/experiments/jqe-retest/matches.mjs replay
          node native/experiments/jqe-retest/audit.mjs benchmarks/jqe-retest-2026-11-09/matches.json /tmp/jqe-current-audit.json
          node --test native/experiments/jqe-confirm/matches.test.mjs
          node native/experiments/jqe-confirm/matches.mjs replay
          node native/experiments/jqe-retest/audit.mjs benchmarks/jqe-confirm-2026-11-09/matches.json /tmp/jqe-confirm-audit.json
      - name: Optional combined JQE source and public replay (no FMA execution)
        run: |
          node --test native/experiments/jqe-combined/matches.test.mjs
          node native/experiments/jqe-combined/matches.mjs replay
          node native/experiments/jqe-retest/audit.mjs benchmarks/jqe-combined-2026-11-18/matches.json /tmp/jqe-combined-audit.json
      - name: Current evaluator, normalization, public information and root rulings
        run: |
          node native/build.mjs
          node native/experiments/jqe-current/build.mjs --control
          node native/experiments/jqe-current/check.mjs
          node native/experiments/jqe-current/rules.mjs
          node native/experiments/jqe-current/repetition.mjs
          node native/experiments/jqe-current/control-check.mjs
      - name: Memory safety and deterministic worker restoration
        run: |
          node native/experiments/jqe-current/check.mjs --sanitize
          node native/experiments/jqe-current/rules.mjs --sanitize
          JIEQI_NATIVE_SANITIZE=1 node native/experiments/jqe-current/repetition.mjs
          node native/experiments/jqe-current/thread-check.mjs
      - name: Isolated HTTP history boundaries and cancellation
        run: node --test native/experiments/jqe-current/service-check.mjs
      - name: Optional pinned JQE launcher and fresh-checkout startup
        run: MIST_JQE_TEST_FRESH=1 node --test native/jqe-default-check.mjs
